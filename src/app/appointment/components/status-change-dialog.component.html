<div class="dialog__backdrop" (click)="dismiss()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h2 class="dialog__title">
      Cambiar estado de la cita #{{ appointment().id }}
    </h2>
    <p class="dialog__subtitle">
      Estado actual: <strong>{{ appointment().status }}</strong>
    </p>

    <ul class="dialog__options">
      @for (option of options; track option) {
        <li>
          <button
            type="button"
            class="btn btn--block"
            (click)="choose(option)"
            [disabled]="busy()"
          >
            {{ option }}
          </button>
        </li>
      }
    </ul>

    <button
      type="button"
      class="btn btn--ghost dialog__cancel"
      (click)="dismiss()"
      [disabled]="busy()"
    >
      Cancelar
    </button>
  </div>
</div>
