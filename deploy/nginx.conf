worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy /api/* to the gateway on the shared `platform` network.
        location /api/ {
            proxy_pass http://telemed-ia-api-gateway:80;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-Correlation-Id  $http_x_correlation_id;
            proxy_set_header Idempotency-Key   $http_idempotency_key;

            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Federation manifest must never be cached.
        location = /remoteEntry.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Never cache index.html (SPA entry).
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Long cache for hashed static assets.
        location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}